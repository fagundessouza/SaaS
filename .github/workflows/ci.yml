name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: licitacoes
          POSTGRES_PASSWORD: licitacoes
          POSTGRES_DB: licitacoes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U licitacoes -d licitacoes"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        # bitnami/minio (nao minio/minio) de proposito: aceita configuracao 100% por variavel
        # de ambiente e roda o servidor com o CMD default da imagem — a imagem oficial exige
        # `server /data` como argumento, que o campo `services:` do GitHub Actions nao permite
        # customizar. Ver tambem ops/docker/docker-compose.yml (usa minio/minio + command
        # explicito, o que so e possivel fora do modelo de `services:`).
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: licitacoes
          MINIO_ROOT_PASSWORD: licitacoes123
          MINIO_DEFAULT_BUCKETS: licitacoes-dev
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime_dev_password@localhost:5432/licitacoes
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://licitacoes:licitacoes@localhost:5432/licitacoes
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: licitacoes
      STORAGE_SECRET_KEY: licitacoes123
      STORAGE_BUCKET: licitacoes-dev
      LOG_LEVEL: INFO
      ENVIRONMENT: ci
      # Nunca usar fora de CI — ver core/config.py e .env.example para o padrao de dev local.
      JWT_SECRET_KEY: ci-only-secret-never-use-in-production-1a2b3c4d5e6f

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        run: uv sync

      - name: Criar papel de runtime sem privilegio de superusuario (ver ADR-0002)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=licitacoes psql -h localhost -U licitacoes -d licitacoes \
            -f ../ops/docker/initdb/01-app-role.sql

      - name: Instalar Tesseract OCR (Fase 4 — Document Intelligence)
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Fronteiras de modulo (import-linter)
        run: uv run lint-imports

      - name: Migrations (upgrade)
        run: uv run alembic upgrade head

      - name: Migrations (reversibilidade)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Testes
        run: uv run pytest -v
