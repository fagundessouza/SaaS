[project]
name = "licitacoes-backend"
version = "0.1.0"
description = "Backend do MicroSaaS de inteligencia em licitacoes — Fase 1 (Foundation/Core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "redis>=5.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-dotenv>=1.2.3",
    "bcrypt>=5.0.0",
    "pyjwt>=2.14.0",
    "httpx>=0.28.1",
    "pypdf>=6.19.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "fastembed>=0.8.0",
    "qdrant-client>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "boto3-stubs[s3]>=1.35",
    "respx>=0.21",
    "fpdf2>=2.8.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends(...)/Header(...) em default de parametro e o padrao idiomatico do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["core", "ai_platform", "ingestion", "domains", "api"]

[[tool.importlinter.contracts]]
name = "Camadas de dependencia: api -> domains -> ai_platform -> core"
type = "layers"
layers = [
    "api",
    "domains",
    "ai_platform",
    "core",
]

[[tool.importlinter.contracts]]
name = "ingestion nao pode ser importado por core ou ai_platform"
type = "forbidden"
source_modules = ["core", "ai_platform"]
forbidden_modules = ["ingestion"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ai_platform", "ingestion", "domains", "api"]
